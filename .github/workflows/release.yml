name: Release

# Stable: pushing a tag v<version> (e.g. v0.2.0) publishes a release.
# Latest: every push to main that passes CI publishes a prerelease <package version>-main.<run>.
# Each holds pispark-<version>-<os>-<arch>.tar.gz for Windows x64, Linux x64 and Linux arm64, and
# SHA256SUMS. PiSpark's launcher and the install scripts read these (docs/install.md).
# What a release says is docs/releases/<package version>.md, written with each change (docs/releasing.md).
on:
  push:
    tags: ["v*.*.*"]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Each job asks for what it needs; only publishing writes.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      base: ${{ steps.v.outputs.base }}
      channel: ${{ steps.v.outputs.channel }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            [ "$version" = "$base" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $base"; exit 1; }
            channel=stable
          else
            # A build of main must sort after the newest Stable release: raise package.json after tagging.
            if gh release view "v$base" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "v$base is already released; raise the version in package.json so builds of main are newer."; exit 1
            fi
            version="$base-main.${{ github.run_number }}"
            channel=latest
          fi
          # A release says what is new: its notes are written with the changes, before it is built.
          [ -s "docs/releases/$base.md" ] || { echo "docs/releases/$base.md is missing or empty: write what is new in $base (docs/releasing.md)."; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: windows-latest, os: win, arch: x64 }
          - { runner: ubuntu-24.04, os: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm run build
      - run: node scripts/release.mjs --os ${{ matrix.os }} --arch ${{ matrix.arch }} --version ${{ needs.version.outputs.version }} --channel ${{ needs.version.outputs.channel }} --out release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: release/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      # The release itself, and a signed statement that this workflow built its archives.
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Checksums
        working-directory: release
        run: sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      # Anyone can check an archive came from this workflow: gh attestation verify <archive> --repo <owner>/<repo>
      - name: Provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          BASE: ${{ needs.version.outputs.base }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          flags=""
          [ "$CHANNEL" = "latest" ] && flags="--prerelease"
          # What is new, as written with the changes; then how to install; then GitHub's list of what was merged.
          { cat "docs/releases/$BASE.md"; printf '\n---\n\nPiSpark %s (%s channel). Install or update: https://github.com/%s/blob/main/docs/install.md\n' "$VERSION" "$CHANNEL" "$GITHUB_REPOSITORY"; } > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" release/* --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "PiSpark $VERSION" $flags --generate-notes --notes "$(cat "$RUNNER_TEMP/notes.md")"
      - name: Keep the newest 10 builds of main
        if: needs.version.outputs.channel == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-main\\.")))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes; done
