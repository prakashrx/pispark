name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"
          cache: npm
      # Install scripts are how a poisoned package runs code: none run here (docs/development.md).
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -w @pispark/web
        env:
          PISPARK_TEST_PRODUCTION: '1'
          PISPARK_TEST_RESULTS: ${{ runner.temp }}/pispark-browser-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: browser-results-${{ matrix.os }}
          path: ${{ runner.temp }}/pispark-browser-results
          retention-days: 7
